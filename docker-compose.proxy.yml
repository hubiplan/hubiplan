# Zusatz zu docker-compose.server.yml für den Betrieb hinter einem vorhandenen
# Webserver (z. B. HestiaCP auf dem Echtserver). Der übernimmt HTTPS und leitet an
# 127.0.0.1:WEB_PORT weiter; Caddy belegt dann weder Port 80 noch 443.
# Aktiv, wenn in der .env HUBIPLAN_HINTER_PROXY=1 steht (siehe deploy/server-setup.sh).

services:
  web:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.proxy", "--adapter", "caddyfile"]
    environment:
      # Nur Anfragen mit diesem Kopfwert (setzt nginx) dürfen X-Real-IP vorgeben
      # (deploy/hestia/proxy-geheim.sh). Leer: wie bisher.
      HUBIPLAN_PROXY_GEHEIM: ${HUBIPLAN_PROXY_GEHEIM:-}
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8110}:80"
